<div class="guess-container">
    <h2>Вгадай число 1–9</h2>

    <div class="guess-row">
        <div class="guess-box">
            <input type="number" id="guessInput" class="guess-input" placeholder="Введіть число">
            <button class="guess-btn" id="guessBtn" type="button"></button>
        </div>

    
        <button id="guessResetBtn" class="guess-reset-btn" type="button">Скинути</button>
    </div>

    <div id="guessMessage" aria-live="polite"></div>
</div>
